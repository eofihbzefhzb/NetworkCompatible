name: Tag Version

# Creates the git tag from gradle.properties whenever the version changes on master.
#
# JitPack serves the artifact under the tag name, and Geyser resolves it by that exact
# string in gradle/libs.versions.toml. A forgotten tag is therefore silent: Geyser keeps
# building against the previous transport and the change simply never ships. Tagging here
# means bumping `version=` is the only manual step on this side; Geyser's `nethernet =` still
# has to be bumped to the new tag.
on:
  push:
    branches:
      - master
    paths:
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Needed so the existing tags are present locally and the check below is meaningful.
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(cat gradle.properties | grep version= | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Check whether the tag already exists
        id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.version }} already exists - nothing to do."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.version }} will be created."
          fi

      - name: Create and push the tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create the release
        if: steps.check.outputs.exists == 'false'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          allowUpdates: true
          body: |
            JitPack builds this tag on demand; there is no artifact to upload here.

            Consume it from Geyser by setting the version in `gradle/libs.versions.toml`
            to the tag name:

            ```toml
            nethernet = "${{ steps.version.outputs.version }}"
            ```
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the tag on JitPack
        if: steps.check.outputs.exists == 'false'
        # JitPack only builds a tag the first time something asks for it, and that request fails
        # while the build is still running. Geyser's release build used to be that first request,
        # and failed on it. Ask here and wait, so a green run means Geyser can resolve the version.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://jitpack.io/com/github/${{ github.repository }}/netty-transport-nethernet/$VERSION/netty-transport-nethernet-$VERSION.pom"
          for attempt in $(seq 1 40); do
            if curl -sf --max-time 60 -o /dev/null "$URL"; then
              echo "JitPack has built $VERSION."
              exit 0
            fi
            echo "JitPack is still building $VERSION (attempt $attempt/40)..."
            sleep 15
          done
          echo "JitPack did not finish $VERSION in time: https://jitpack.io/com/github/${{ github.repository }}/$VERSION/build.log"
          exit 1
